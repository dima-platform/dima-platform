services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dima
      POSTGRES_USER: dima_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dima_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dima_local -d dima"]
      interval: 5s
      retries: 10
volumes:
  dima_data:
